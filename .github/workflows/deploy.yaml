name: Deploy to FTP

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and build
        run: |
          npm install 
          npm run build  # This will create the dist/ directory

      - name: Set up FTP
        run: |
          sudo apt-get install -y lftp

      - name: Deploy to FTP
        run: |
          lftp -e "set ssl:verify-certificate no; mirror -R --overwrite ./build /public_html; quit" -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_HOST }}
          echo "Deployment completed successfully."